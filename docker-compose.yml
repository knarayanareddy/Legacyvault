services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: legacyvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8788:8788"

  indexer:
    build:
      context: .
      dockerfile: indexer/Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8787:8787"

  notifier:
    build:
      context: .
      dockerfile: notifier/Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - redis
    ports:
      - "8789:8789"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file: .env
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
